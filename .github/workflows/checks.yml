name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Outdated packages (for information)
        run: npm outdated || true
      - name: Security advisories (for information)
        run: npm audit --omit=dev || true
      - name: Tests
        run: npm test
